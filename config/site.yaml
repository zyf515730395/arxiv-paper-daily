conference_intake:
  # Generic method terms require visual context before title-only acceptance.
  context_required_phrases:
    - diffusion model
    - flow matching
    - rectified flow
    - consistency model
    - generative adversarial
    - masked image modeling
    - dynamics model
    - environment model
    - action conditioned
    - neural field
  visual_context: '(image|video|visual|3d|4d|scene|render|pixel|photograph|portrait|motion|world|robot|embodied)'
  excluded_title_pattern: '(medical|clinical|biomedical|radiology|radiograph|tomography|mri|cancer|tumor|tumour|pathology|pathological|histopathology|histopathological|histolog|angiograph|\bct volume\b|endoscop|surgical|surgery|retinal|fundus|ultrasound|echocardiograph)'
  summary_batch_size: 20
  summary_timeout_seconds: 900
