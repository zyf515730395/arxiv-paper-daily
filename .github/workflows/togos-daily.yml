# Collect candidates only. Local WSL processing owns publication.

name: Run LOKEN Daily

on:
  workflow_dispatch:
  schedule:
    # Daily collection plus bounded catch-up; completed UTC days are skipped.
    - cron: "0 1 * * *"
    - cron: "17 5,9 * * *"

permissions:
  contents: write

concurrency:
  group: arxiv-paper-collection
  cancel-in-progress: false

jobs:
  collect:
    name: collect-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Collect candidates
        id: collection
        continue-on-error: true
        # Leave the job enough time to commit the latest atomic shard checkpoint.
        timeout-minutes: 50
        run: python -m papers.collector --skip-if-current --report build/reports/collection.json

      # The ledger contains completed topic cursors, successful shard progress,
      # and any active rate-limit cooldown. Commit it even when collection exits 75.
      - name: Commit candidate ledger checkpoints
        if: always() && steps.collection.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/papers/arxiv-candidates.json
          if git diff --cached --quiet; then
            echo "No candidate updates"
          else
            git commit -m "Checkpoint arXiv candidate collection"
            git push origin main
          fi

      - name: Report incomplete collection
        if: always() && steps.collection.outcome == 'failure'
        run: |
          echo "::error::Collection incomplete. Successful shards and completed topics were saved; the next scheduled catch-up resumes missing shards after any persisted rate-limit cooldown."
          if [ -f build/reports/collection.json ]; then
            cat build/reports/collection.json >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
